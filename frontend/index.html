<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Waite</title>
</head>
 
<body>

    <header class="header">
        <h2>Voice Waiter</h2>
        <p>Smart Restaurant Assistant</p>
    </header>

    <main class="container">

        <section class="welcome">
            <h1>Welcome to Our Restaurant</h1>
            <p>I'm your virtual waiter. How can I help you?</p>
            <img src="assets/waiter.png" alt="3D Waiter" class="waiter">
            <button class="mic-button">
             🎤 Tap to Speak
             </button>
        </section>
        <section class="chat-box">

    <div class="message waiter-message">
        Hello! What would you like to order?
    </div>

    <div class="message customer-message">
        I want a burger.
    </div>

</section>

    </main>

</body>

</html>
